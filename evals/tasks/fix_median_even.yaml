name: fix_median_even
category: bugfix
description: Fix median for even-length input without touching the tests.
prompt: |
  stats.py 的 median 对偶数长度的列表结果不对，修好它。测试在 test_stats.py，不要改测试。
files:
  stats.py: |
    def median(xs):
        s = sorted(xs)
        return s[len(s) // 2]
  test_stats.py: |
    from stats import median


    def test_odd():
        assert median([3, 1, 2]) == 2
        assert median([5]) == 5


    def test_even():
        assert median([4, 1, 3, 2]) == 2.5
        assert median([1, 2]) == 1.5
checks:
  - cmd: python -m pytest -q
  - file: test_stats.py
    contains: == 2.5
solution:
  stats.py: |
    def median(xs):
        s = sorted(xs)
        n = len(s)
        mid = n // 2
        if n % 2:
            return s[mid]
        return (s[mid - 1] + s[mid]) / 2
