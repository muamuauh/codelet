name: write_tests
category: testing
description: Write tests strong enough to catch two mutants.
prompt: |
  给 leap.py 的 is_leap_year 写单元测试，放在 test_leap.py，覆盖普通年、闰年、整百年和整四百年。不要修改 leap.py。
files:
  leap.py: |
    def is_leap_year(year):
        return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
  .mutants/m1/leap.py: |
    def is_leap_year(year):
        return year % 4 == 0
  .mutants/m2/leap.py: |
    def is_leap_year(year):
        return year % 4 == 0 and year % 100 != 0
checks:
  - cmd: python -m pytest -q
  - file: leap.py
    contains: year % 400 == 0
  - cmd: python -c "import shutil, subprocess, sys; dirs = ['.mutants/m1', '.mutants/m2']; [shutil.copy('test_leap.py', d) for d in dirs]; rc = [subprocess.run([sys.executable, '-m', 'pytest', '-q', '-p', 'no:cacheprovider', 'test_leap.py'], cwd=d, capture_output=True).returncode for d in dirs]; sys.exit(0 if all(rc) else 1)"
solution:
  test_leap.py: |
    from leap import is_leap_year


    def test_common_year():
        assert not is_leap_year(2023)


    def test_leap_year():
        assert is_leap_year(2024)


    def test_century_is_not_leap():
        assert not is_leap_year(1900)


    def test_four_hundred_is_leap():
        assert is_leap_year(2000)
