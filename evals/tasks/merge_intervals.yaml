prompt: |
  issue #19：实现 intervals.merge

  `merge(intervals)` 接收 `(start, end)` 整数闭区间的列表，返回合并后、按 start 升序的
  `(start, end)` 元组列表。规则：

  - 重叠的区间合并；
  - 相邻的也合并：(1, 3) 和 (4, 6) 之间没有空隙（都是整数），合并为 (1, 6)；
    (1, 3) 和 (5, 6) 之间隔着 4，不合并；
  - start > end 的区间是非法输入，抛 ValueError；
  - 不得修改传入的列表。
