  test_lru.py: |
    from lru import LRUCache


    def test_basic_eviction():
        c = LRUCache(2)
        c.put(1, "a")
        c.put(2, "b")
        assert c.get(1) == "a"      # 1 is now most recent
        c.put(3, "c")               # evicts 2
        assert c.get(2) == -1
        assert c.get(3) == "c"


    def test_update_refreshes():
        c = LRUCache(2)
        c.put(1, "a")
        c.put(2, "b")
        c.put(1, "z")               # update, 1 most recent
        c.put(3, "c")               # evicts 2
        assert c.get(1) == "z"
        assert c.get(2) == -1
