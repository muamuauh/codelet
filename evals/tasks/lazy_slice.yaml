solution:
  lazyseq.py: |
    class LazySeq:
        """A read-only view over an iterator factory; items are produced on demand."""

        def __init__(self, factory, length):
            self._factory = factory   # factory() -> a fresh iterator over the items
            self._len = length

        def __len__(self):
            return self._len

        def _fetch(self, indices):
            need = set(indices)
            got = {}
            if need:
                for i, item in enumerate(self._factory()):
                    if i in need:
                        got[i] = item
                        if len(got) == len(need):
                            break
            return [got[i] for i in indices]

        def __getitem__(self, key):
            if isinstance(key, slice):
                return self._fetch(list(range(self._len)[key]))
            index = range(self._len)[key]          # IndexError / TypeError like list
            return self._fetch([index])[0]
