    import itertools

    import pytest

    from lazyseq import LazySeq


    def make(n, counter=None):
        def factory():
            for i in range(n):
                if counter is not None:
                    counter.append(i)
                yield i * 10
        return LazySeq(factory, n)


    VALUES = [None, -7, -3, -1, 0, 1, 2, 4, 9]
    STEPS = [None, 1, 2, 3, -1, -2]


    @pytest.mark.parametrize("start,stop,step", list(itertools.product(VALUES, VALUES, STEPS)))
    def test_slices_match_list(start, stop, step):
        ref = [i * 10 for i in range(6)]
        assert make(6)[start:stop:step] == ref[start:stop:step]


    @pytest.mark.parametrize("i", [-6, -1, 0, 5])
    def test_index_matches_list(i):
        assert make(6)[i] == [i * 10 for i in range(6)][i]


    @pytest.mark.parametrize("i", [6, 100, -7])
    def test_out_of_range_index(i):
        with pytest.raises(IndexError):
            make(6)[i]


    def test_zero_step():
        with pytest.raises(ValueError):
            make(6)[::0]


    def test_still_lazy():
        seen = []
        s = make(1000, seen)
        assert s[:3] == [0, 10, 20]
        assert len(seen) <= 4
