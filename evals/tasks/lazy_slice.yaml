name: lazy_slice
category: hard
description: "Make a lazy sequence slice exactly like list (hidden edge-case tests)."
prompt: |
  issue #212：LazySeq 的切片和 list 不一致

  `seq[-2:]` 返回了全部元素，`seq[::2]` 的步长被忽略了，`seq[5:1:-1]` 返回空列表。
  请让 LazySeq 的切片和整数下标与「对同样元素建一个 list 再取」的结果完全一致
  （负数下标、步长、越界、步长为 0 都一样）。LazySeq 必须保持按需产生元素：
  取前几个元素时不能把整个序列都生成一遍。
files:
  lazyseq.py: |
    class LazySeq:
        """A read-only view over an iterator factory; items are produced on demand."""

        def __init__(self, factory, length):
            self._factory = factory   # factory() -> a fresh iterator over the items
            self._len = length

        def __len__(self):
            return self._len

        def __getitem__(self, key):
            if isinstance(key, slice):
                start = key.start or 0
                stop = key.stop if key.stop is not None else self._len
                out = []
                for i, item in enumerate(self._factory()):
                    if i >= stop:
                        break
                    if i >= start:
                        out.append(item)
                return out
            if key < 0:
                key += self._len
            for i, item in enumerate(self._factory()):
                if i == key:
                    return item
            raise IndexError(key)
  test_lazyseq.py: |
    from lazyseq import LazySeq


    def make(n):
        return LazySeq(lambda: iter(range(n)), n)


    def test_basic():
        s = make(5)
        assert len(s) == 5
        assert s[0] == 0 and s[4] == 4
        assert s[1:3] == [1, 2]
