name: format_bytes_regression
category: hard
description: "Drop the trailing .0 for whole numbers without changing anything else."
prompt: |
  issue #87：整数倍时多了一个 .0

  `format_bytes(1024)` 显示 `1.0 KB`，希望显示 `1 KB`；同理 `2 MB`、`1 TB`。
  其它情况的输出保持不变。
files:
  units.py: |
    def format_bytes(n):
        """Human-readable size, binary units (1 KB = 1024 B): 1536 -> '1.5 KB'."""
        for unit in ["B", "KB", "MB", "GB"]:
            if abs(n) < 1024:
                return f"{n} {unit}" if unit == "B" else f"{n:.1f} {unit}"
            n /= 1024
        return f"{n:.1f} TB"
  test_units.py: |
    from units import format_bytes


    def test_examples():
        assert format_bytes(512) == "512 B"
        assert format_bytes(1536) == "1.5 KB"
hidden_files:
  test_units_hidden.py: |
    import pytest

    from units import format_bytes


    @pytest.mark.parametrize("n,want", [
        (1024, "1 KB"), (2 * 1024 ** 2, "2 MB"), (1024 ** 4, "1 TB"), (10 * 1024, "10 KB"),
        (-1024, "-1 KB"),
    ])
    def test_whole_numbers(n, want):
        assert format_bytes(n) == want


    @pytest.mark.parametrize("n,want", [
        (0, "0 B"), (512, "512 B"), (1023, "1023 B"), (1536, "1.5 KB"),
        (1065, "1.0 KB"),            # 1.04 KB rounds to 1.0, it is not a whole number
        (1048575, "1024.0 KB"),      # 1023.999 KB: rounding, not a whole number
        (int(1.5 * 1024 ** 4), "1.5 TB"), (-1536, "-1.5 KB"),
    ])
    def test_everything_else_unchanged(n, want):
        assert format_bytes(n) == want
checks:
  - cmd: python -m pytest -q
solution:
  units.py: |
    def _num(x):
        return f"{x:.0f}" if float(x).is_integer() else f"{x:.1f}"


    def format_bytes(n):
        """Human-readable size, binary units (1 KB = 1024 B): 1536 -> '1.5 KB'."""
        for unit in ["B", "KB", "MB", "GB"]:
            if abs(n) < 1024:
                return f"{n} {unit}" if unit == "B" else f"{_num(n)} {unit}"
            n /= 1024
        return f"{_num(n)} TB"
